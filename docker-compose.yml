version: "3.8"

services:
  # ── Message Broker ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: hotel_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache Store ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  # ── Databases ──────────────────────────────────────────────
  users-db:
    image: postgres:15-alpine
    container_name: users_postgres
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - users_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Mapped to 5433 to avoid conflicts on host machine

  hotels-db:
    image: postgres:15-alpine
    container_name: hotels_postgres
    environment:
      POSTGRES_DB: hotels_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - hotels_data:/var/lib/postgresql/data
    ports:
      - "5434:5432" # Mapped to 5434

  bookings-db:
    image: postgres:15-alpine
    container_name: bookings_postgres
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - bookings_data:/var/lib/postgresql/data
    ports:
      - "5435:5432" # Mapped to 5435

  wallet-db:
    image: postgres:15-alpine
    container_name: wallet_postgres
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - wallet_data:/var/lib/postgresql/data
    ports:
      - "5436:5432" # Mapped to 5436

  # ── Microservices ──────────────────────────────────────────
  user-service:
    build: ./user-service
    container_name: user_service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: users-db
      DB_PORT: 5432 # Internal docker network port
      DB_NAME: users_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: super_secret_jwt_key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-db:
        condition: service_started
    command: sh -c "node src/db/migrate.js && npm start"

  hotel-service:
    build: ./hotel-service
    container_name: hotel_service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: hotels-db
      DB_PORT: 5432
      DB_NAME: hotels_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: super_secret_jwt_key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      hotels-db:
        condition: service_started
    command: sh -c "node src/db/migrate.js && npm start"

  booking-service:
    build: ./booking-service
    container_name: booking_service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: bookings-db
      DB_PORT: 5432
      DB_NAME: bookings_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: super_secret_jwt_key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      HOTEL_SERVICE_URL: http://hotel-service:3002
      WALLET_SERVICE_URL: http://wallet-service:3004
    depends_on:
      rabbitmq:
        condition: service_healthy
      bookings-db:
        condition: service_started
      hotel-service:
        condition: service_started
    command: sh -c "node src/db/migrate.js && npm start"

  wallet-service:
    build: ./wallet-service
    container_name: wallet_service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: wallet-db
      DB_PORT: 5432
      DB_NAME: wallet_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: super_secret_jwt_key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OWNER_USER_ID: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
      wallet-db:
        condition: service_started
    command: sh -c "node src/db/migrate.js && npm start"

  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: super_secret_jwt_key
      USER_SERVICE_URL: http://user-service:3001
      HOTEL_SERVICE_URL: http://hotel-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      WALLET_SERVICE_URL: http://wallet-service:3004
    depends_on:
      - user-service
      - hotel-service
      - booking-service
      - wallet-service

volumes:
  users_data:
  hotels_data:
  bookings_data:
  wallet_data:
